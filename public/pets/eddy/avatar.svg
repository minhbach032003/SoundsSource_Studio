<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient: Warm Scholarly Studio -->
    <radialGradient id="eddy-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a2418"/>
      <stop offset="65%" stop-color="#18150f"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </radialGradient>

    <!-- Outer Golden Bezel Gradient -->
    <linearGradient id="eddy-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Golden Yellow Bear Fur Gradient -->
    <linearGradient id="eddy-fur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Snout / Cream Accent Gradient -->
    <linearGradient id="eddy-snout" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Forest Green Educator Hoodie Gradient -->
    <linearGradient id="eddy-hoodie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <clipPath id="eddy-clip">
      <circle cx="64" cy="64" r="58"/>
    </clipPath>
  </defs>

  <!-- Ambient Outer Ring -->
  <circle cx="64" cy="64" r="61" stroke="url(#eddy-ring)" stroke-width="1.5" stroke-opacity="0.6"/>

  <g clip-path="url(#eddy-clip)">
    <!-- Backdrop -->
    <circle cx="64" cy="64" r="58" fill="url(#eddy-bg)"/>

    <!-- Warm Amber Aura Halo behind Head -->
    <circle cx="64" cy="50" r="36" fill="#f59e0b" opacity="0.12"/>
    <!-- Subtle Scholarly Stars / Embers -->
    <circle cx="28" cy="32" r="1.2" fill="#fbbf24" opacity="0.5"/>
    <circle cx="100" cy="36" r="1.5" fill="#fbbf24" opacity="0.4"/>
    <circle cx="20" cy="65" r="1" fill="#fef08a" opacity="0.3"/>
    <circle cx="108" cy="68" r="1.2" fill="#fef08a" opacity="0.3"/>

    <!-- Green Hoodie Body -->
    <path d="M26 118 C26 86 38 74 64 74 C90 74 102 86 102 118 Z" fill="url(#eddy-hoodie)"/>
    <!-- Hoodie Seam / Pocket Trim -->
    <path d="M38 114 C52 108 76 108 90 114" stroke="#22c55e" stroke-width="1.2" stroke-linecap="round" opacity="0.6" fill="none"/>

    <!-- Green Hoodie Collar / Hood Fold -->
    <path d="M36 78 C42 70 52 68 64 68 C76 68 86 70 92 78 C86 86 76 89 64 89 C52 89 42 86 36 78 Z" fill="#166534" stroke="#22c55e" stroke-width="0.8"/>

    <!-- Hoodie Drawstrings -->
    <path d="M52 79 C51 88 50 97 51 106" stroke="#fef3c7" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <rect x="50" y="105" width="2.2" height="3.5" rx="0.6" fill="#cbd5e1"/>
    <path d="M76 79 C77 88 78 97 77 106" stroke="#fef3c7" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <rect x="76" y="105" width="2.2" height="3.5" rx="0.6" fill="#cbd5e1"/>

    <!-- Round Bear Ears -->
    <!-- Left Ear -->
    <circle cx="36" cy="34" r="11" fill="url(#eddy-fur)"/>
    <circle cx="36" cy="34" r="6.5" fill="#b45309"/>
    <!-- Right Ear -->
    <circle cx="92" cy="34" r="11" fill="url(#eddy-fur)"/>
    <circle cx="92" cy="34" r="6.5" fill="#b45309"/>

    <!-- Bear Head -->
    <ellipse cx="64" cy="52" rx="29" ry="26" fill="url(#eddy-fur)"/>

    <!-- Fluffy Cheek Tufts -->
    <path d="M35 52 L29 55 L34 58 L28 62 L36 63" fill="url(#eddy-fur)"/>
    <path d="M93 52 L99 55 L94 58 L100 62 L92 63" fill="url(#eddy-fur)"/>

    <!-- Snout / Cream Muzzle -->
    <ellipse cx="64" cy="61" rx="17" ry="13" fill="url(#eddy-snout)"/>

    <!-- Wise, Calm Eyes behind Glasses -->
    <!-- Left Eye -->
    <ellipse cx="51" cy="48" rx="4.5" ry="5.5" fill="#1e1b18"/>
    <circle cx="50" cy="46" r="1.5" fill="#ffffff"/>
    <circle cx="52.5" cy="50" r="0.7" fill="#fbbf24"/>
    <!-- Friendly Eyebrow -->
    <path d="M45 40 Q51 38 56 41" stroke="#92400e" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Right Eye -->
    <ellipse cx="77" cy="48" rx="4.5" ry="5.5" fill="#1e1b18"/>
    <circle cx="76" cy="46" r="1.5" fill="#ffffff"/>
    <circle cx="78.5" cy="50" r="0.7" fill="#fbbf24"/>
    <!-- Friendly Eyebrow -->
    <path d="M72 41 Q77 38 83 40" stroke="#92400e" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Round Glasses (Key Feature: Scholarly Mentor) -->
    <!-- Glass Lens Tint -->
    <circle cx="51" cy="49" r="11" fill="#38bdf8" opacity="0.12"/>
    <circle cx="77" cy="49" r="11" fill="#38bdf8" opacity="0.12"/>
    <!-- Dark Horn-rimmed Frames -->
    <circle cx="51" cy="49" r="11" stroke="#0f172a" stroke-width="2.2" fill="none"/>
    <circle cx="77" cy="49" r="11" stroke="#0f172a" stroke-width="2.2" fill="none"/>
    <!-- Bridge Over Snout -->
    <path d="M62 48 Q64 46 66 48" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- Frame Temples towards Ears -->
    <path d="M40 48 L32 46" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M88 48 L96 46" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Glass Specular Reflection Highlight Slashes -->
    <path d="M45 42 L55 52" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <path d="M71 42 L81 52" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

    <!-- Bear Nose & Friendly Educator Smile -->
    <path d="M58 57 C58 55 70 55 70 57 C70 63 65 65 64 65 C63 65 58 63 58 57 Z" fill="#381b0d"/>
    <ellipse cx="64" cy="57" rx="3.5" ry="1.2" fill="#ffffff" opacity="0.4"/>
    <!-- Calm Gentle Smile -->
    <path d="M64 65 L64 68 M57 66 Q64 71 71 66" stroke="#451a03" stroke-width="1.4" stroke-linecap="round" fill="none"/>

    <!-- Bear Paws (Resting Thoughtfully in Front) -->
    <ellipse cx="44" cy="116" rx="8" ry="6" fill="url(#eddy-fur)"/>
    <circle cx="41" cy="113" r="1.5" fill="#b45309"/>
    <circle cx="44" cy="112" r="1.5" fill="#b45309"/>
    <circle cx="47" cy="113" r="1.5" fill="#b45309"/>

    <ellipse cx="84" cy="116" rx="8" ry="6" fill="url(#eddy-fur)"/>
    <circle cx="81" cy="113" r="1.5" fill="#b45309"/>
    <circle cx="84" cy="112" r="1.5" fill="#b45309"/>
    <circle cx="87" cy="113" r="1.5" fill="#b45309"/>
  </g>
</svg>
