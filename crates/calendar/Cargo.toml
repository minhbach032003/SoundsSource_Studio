[package]
name = "sound-calendar"
version = "0.1.0"
edition = "2024"
description = "Google Calendar integration with OAuth PKCE and Pomodoro Focus sync"

[dependencies]
sound-core = { path = "../core" }
sound-auth = { path = "../auth" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
reqwest = { version = "0.13", features = ["blocking", "json", "form", "query"] }
url = "2.5"
