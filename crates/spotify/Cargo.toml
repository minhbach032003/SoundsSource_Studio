[package]
name = "sound-spotify"
version = "0.1.0"
edition = "2024"
description = "Spotify Web API, OAuth and Librespot local connect playback"

[dependencies]
sound-core = { path = "../core" }
sound-auth = { path = "../auth" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["blocking", "json", "form", "query"] }
url = "2.5"
subtle = "2.5"
thiserror = "2.0"
librespot-core = { version = "0.8.0", default-features = false, features = ["native-tls"] }
librespot-connect = { version = "0.8.0", default-features = false }
librespot-playback = { version = "0.8.0", default-features = false }
librespot-metadata = { version = "0.8.0", default-features = false }
librespot-oauth = { version = "0.8.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
