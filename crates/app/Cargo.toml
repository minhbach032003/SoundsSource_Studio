[package]
name = "rust-sound"
version = "0.1.0"
description = "Per-App Audio Control for macOS rewritten in Rust with Tauri"
edition = "2024"

[lib]
name = "rust_sound_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sound-core = { path = "../core" }
sound-engine = { path = "../engine" }
pingloom = { path = "../pingloom" }
rodio = "0.22"
librespot-playback = { version = "0.8.0", default-features = false }
sysinfo = "0.36.1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSEvent", "NSWindow", "NSColor"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
block2 = "0.6"

[dev-dependencies]
serde_json = "1.0"
chrono = "0.4"
base64 = "0.22"
uuid = { version = "1.10", features = ["v4"] }
