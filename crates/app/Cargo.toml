[package]
name = "rust-sound"
version = "0.1.0"
description = "Per-App Audio Control for macOS rewritten in Rust with Tauri"
edition = "2024"

[lib]
name = "rust_sound_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
sound-core = { path = "../core" }
sound-engine = { path = "../engine" }
