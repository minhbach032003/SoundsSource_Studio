[package]
name = "sound-core"
version = "0.1.0"
edition = "2024"
description = "macOS audio hardware, process taps and ring buffer"

[build-dependencies]
cc = "1"

[dependencies]
futures-channel = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
