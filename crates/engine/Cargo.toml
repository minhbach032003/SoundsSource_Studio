[package]
name = "sound-engine"
version = "0.1.0"
edition = "2024"
description = "Audio DSP, routing state and presets"

[dependencies]
sound-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
subtle = "2.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2.0"
tempfile = "3"
reqwest = { version = "0.13", features = ["blocking", "json", "form", "query"] }
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
