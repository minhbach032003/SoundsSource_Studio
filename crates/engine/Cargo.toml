[package]
name = "sound-engine"
version = "0.1.0"
edition = "2024"
description = "Audio DSP, routing state and presets"

[dependencies]
sound-core = { path = "../core" }
sound-dsp = { path = "../dsp" }
sound-auth = { path = "../auth" }
sound-pet = { path = "../pet" }
sound-calendar = { path = "../calendar" }
sound-spotify = { path = "../spotify" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2.0"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
