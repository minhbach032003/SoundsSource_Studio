[package]
name = "pingloom"
version = "0.1.0"
edition = "2021"
description = "Native desktop ping and emote gestures"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry"] }
