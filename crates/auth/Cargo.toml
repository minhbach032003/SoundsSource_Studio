[package]
name = "sound-auth"
version = "0.1.0"
edition = "2024"
description = "Authentication: JWT, PKCE, Google OAuth, Keycloak, and Dual Auth"

[dependencies]
sound-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
subtle = "2.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2.0"
reqwest = { version = "0.13", features = ["blocking", "json", "form", "query"] }
url = "2.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
