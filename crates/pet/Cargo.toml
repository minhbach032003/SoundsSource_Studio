[package]
name = "sound-pet"
version = "0.1.0"
edition = "2024"
description = "AgentPet companion system: sessions, care, hooks, transcripts and IPC server"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
