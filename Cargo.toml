[workspace]
members = ["crates/core", "crates/engine", "crates/app", "crates/pingloom"]
resolver = "2"

[patch.crates-io]
vergen-gitcl = { git = "https://github.com/rustyhorde/vergen.git", tag = "vergen_gitcl_1.0.8" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
